# Staging frontend and API share one service. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: ecarteo-staging
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile's final stage is runner; its CMD starts the standalone server.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: ECARTEO_DEPLOYMENT_TARGET
        value: fullstack
      # Render assigns RENDER_EXTERNAL_URL. Set APP_URL for a custom domain.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_CA_CERT
        sync: false
      - key: OPS_HEALTH_TOKEN
        sync: false
