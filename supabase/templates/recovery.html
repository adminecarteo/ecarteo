<!doctype html>
<html lang="fr">
  <body>
    <h1>Choisissez un nouveau mot de passe</h1>
    <h2 lang="en">Choose a new password</h2>
    <p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">
        Réinitialiser mon mot de passe / <span lang="en">Reset my password</span>
      </a>
    </p>
    <p>Si vous n’avez pas demandé ce changement, ignorez ce message.</p>
    <p lang="en">If you did not request this change, ignore this message.</p>
  </body>
</html>
