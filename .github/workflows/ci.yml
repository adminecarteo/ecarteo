name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecarteo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Prepare isolated database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d ecarteo_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d ecarteo_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h 127.0.0.1 -U postgres -d ecarteo_test -v ON_ERROR_STOP=1 -f supabase/tests/isolation.sql
      - run: npm test
        env:
          ECARTEO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ecarteo_test
      - run: npm run build
      - name: Validate frontend production build without server secrets
        env:
          ECARTEO_DEPLOYMENT_TARGET: frontend
          APP_URL: https://frontend.example.test
          ECARTEO_BACKEND_ORIGIN: https://backend.example.test
          NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          DATABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          SUPABASE_DB_CA_CERT: ''
          OPS_HEALTH_TOKEN: ''
          STRIPE_SECRET_KEY: ''
          STRIPE_WEBHOOK_SECRET: ''
          STRIPE_BILLING_PLANS: ''
        run: node scripts/validate-config.mjs --production && npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify frontend session bootstrap
        env:
          E2E_DEPLOYMENT_TARGET: frontend
        run: npx playwright test --config=playwright.frontend.config.ts
      - name: Validate production Docker image
        run: docker build --target runner -t ecarteo:ci .
      - name: Validate maintenance Docker image
        run: docker build --target maintenance -t ecarteo-maintenance:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
