name: Production maintenance

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Remove eligible expired staged uploads
        type: boolean
        default: false

permissions: {}

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check readiness and expired upload reservations
        env:
          ORIGIN: ${{ vars.PRODUCTION_APP_ORIGIN }}
          HEALTH_TOKEN: ${{ secrets.PRODUCTION_HEALTH_TOKEN }}
          CLEANUP_TOKEN: ${{ secrets.PRODUCTION_CLEANUP_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as wait } from 'node:timers/promises';

          const { ORIGIN, HEALTH_TOKEN, CLEANUP_TOKEN, APPLY } = process.env;
          if (!['https://ecarteo-production.onrender.com', 'https://app.ecarteo.fr', 'https://ecarteo.fr'].includes(ORIGIN)) {
            throw Error('Set PRODUCTION_APP_ORIGIN to a reviewed Écartéo production origin.');
          }
          if (HEALTH_TOKEN?.length < 32 || !HEALTH_TOKEN || CLEANUP_TOKEN?.length < 32 ||
              !CLEANUP_TOKEN || HEALTH_TOKEN === CLEANUP_TOKEN) {
            throw Error('Configure two distinct production operation tokens.');
          }

          async function call(path, token, method = 'GET') {
            const response = await fetch(ORIGIN + path, {
              method, headers: {authorization: 'Bearer ' + token},
              redirect: 'error', signal: AbortSignal.timeout(90_000),
            });
            if (!response.ok) throw Error('HTTP ' + response.status);
            try { return await response.json(); }
            catch { throw Error('Unexpected non-JSON maintenance response.'); }
          }

          let ready = false;
          for (let attempt = 0; attempt < 2 && !ready; attempt++) {
            try {
              const result = await call('/api/ready', HEALTH_TOKEN);
              ready = result.status === 'ready' &&
                ['configuration','database','schema','storage'].every(key => result.checks?.[key] === true);
            } catch { /* A sleeping Render instance can return a wake-up page on the first request. */ }
            if (!ready && !attempt) await wait(15_000);
          }
          if (!ready) throw Error('Production readiness failed. Review the Render readiness check.');
          console.log('Production readiness passed.');

          const path = '/api/maintenance/staged-uploads';
          const preview = await call(path, CLEANUP_TOKEN);
          if (!Number.isSafeInteger(preview.eligible) || preview.eligible < 0) throw Error('Invalid preview.');
          console.log('Eligible expired staged uploads: ' + preview.eligible);
          if (APPLY !== 'true' || !preview.eligible) process.exit(0);
          const result = await call(path, CLEANUP_TOKEN, 'POST');
          if (!Number.isSafeInteger(result.removed) || result.removed < 0 || result.removed > 100) {
            throw Error('Invalid cleanup result.');
          }
          console.log('Removed expired staged uploads: ' + result.removed);
          if (result.removed < preview.eligible || result.removed === 100) {
            const remaining = await call(path, CLEANUP_TOKEN);
            if (remaining.eligible !== 0) throw Error('Expired reservations remain. Review and rerun.');
          }
          NODE
